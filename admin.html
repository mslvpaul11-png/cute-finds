<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cute Finds | Product Uploader</title>
<style>
body{margin:0;background:#f7f4ee;color:#302b26;font-family:Arial,sans-serif}
main{max-width:650px;margin:25px auto;padding:18px}
h1,h2{font-family:Georgia,serif;font-weight:normal}
a{color:inherit}
.panel{background:#fffdf9;padding:20px;border:1px solid #e4ddd3;border-radius:12px;margin-top:20px}
label{display:block;font-size:14px;margin:14px 0 6px}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e4ddd3;border-radius:7px;background:white}
button{padding:12px 18px;background:#302b26;color:white;border:0;border-radius:7px;margin-top:16px;width:100%;cursor:pointer}
button:disabled{opacity:.5}
#status{margin-top:15px;line-height:1.5}
small{color:#756d63}
</style>
</head>
<body>
<main>
<a href="index.html">← View storefront</a>
<h1>Cute Finds</h1>
<p>Product uploader</p>

<section class="panel">
<h2>Add a new product</h2>

<form id="productForm">
<label>Product name *</label>
<input id="name" required placeholder="Ceramic bedside lamp">

<label>Category *</label>
<input id="category" required placeholder="Home, Beauty, Fashion">

<label>Description</label>
<textarea id="description" rows="3" placeholder="Short product description"></textarea>

<label>Price</label>
<input id="price" placeholder="$24.99">

<label>Choose product photo *</label>
<input id="photo" type="file" accept="image/*" required>
<small>Choose an image from your phone gallery.</small>

<label>Amazon affiliate link *</label>
<input id="link" type="url" required placeholder="Paste your affiliate link">

<label>Tag</label>
<input id="tag" placeholder="Editor's pick">

<button id="submitBtn" type="submit">Upload product</button>
</form>

<p id="status"></p>
</section>
</main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-xED-OI6BASpaVbZHD0HKFahPt5kBzId7DkpTqBWs6fOcsxFsulHjGMnenkXnbTWV/exec";

const form = document.getElementById("productForm");
const statusBox = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const img = new Image();

      img.onload = () => {
        const maxSize = 1200;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));

        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
        resolve(base64);
      };

      img.onerror = reject;
      img.src = reader.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const file = document.getElementById("photo").files[0];

  if (!file) {
    statusBox.textContent = "Please choose a product photo.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Uploading...";
  statusBox.textContent = "Preparing your product image. Please wait...";

  try {
    const imageBase64 = await resizeImage(file);

    const data = {
      name: document.getElementById("name").value.trim(),
      category: document.getElementById("category").value.trim(),
      description: document.getElementById("description").value.trim(),
      price: document.getElementById("price").value.trim(),
      link: document.getElementById("link").value.trim(),
      tag: document.getElementById("tag").value.trim(),
      imageBase64: imageBase64,
      imageMimeType: "image/jpeg",
      imageName: file.name.replace(/\.[^/.]+$/, "") + ".jpg"
    };

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    statusBox.textContent =
      "Upload request sent. Please check your Google Sheet before adding another product. If the row appears, the upload worked!";

    form.reset();

  } catch (error) {
    statusBox.textContent = "Error: " + error.message;
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "Upload product";
});
</script>
</body>
</html>
