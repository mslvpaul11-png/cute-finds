
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Finds | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      background: #f7f3ed;
      color: #3d352e;
      font-family: Georgia, serif;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 30px;
      background: #fffdf9;
      border: 1px solid #e8dfd3;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      font-weight: normal;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8a7b6b;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d9cfc2;
      border-radius: 6px;
      background: white;
      font: inherit;
      color: #3d352e;
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 6px;
      background: #75634f;
      color: white;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #5d4e3e;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #logoutBtn {
      background: #a18f7a;
      margin-top: 10px;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
      overflow-wrap: anywhere;
    }

    .success {
      display: block !important;
      background: #eaf3e8;
      color: #315b35;
    }

    .error {
      display: block !important;
      background: #fbe9e7;
      color: #963b32;
    }

    .info {
      display: block !important;
      background: #f2eee7;
      color: #675947;
    }

    #adminPanel {
      display: none;
    }

    #loginBtn {
      display: block;
    }

    #userInfo {
      text-align: center;
      color: #75634f;
      margin: 15px 0;
      overflow-wrap: anywhere;
    }

    .note {
      font-size: 13px;
      color: #8a7b6b;
      line-height: 1.5;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Cute Finds</h1>
    <p class="subtitle">Admin Product Dashboard</p>

    <div id="loginPanel">
      <p style="text-align:center;">
        Sign in with your authorized Google account to manage products.
      </p>

      <button id="loginBtn" type="button">
        Sign in with Google
      </button>
    </div>

    <div id="adminPanel">
      <p id="userInfo"></p>

      <form id="productForm">

        <label for="name">Product Name *</label>
        <input
          type="text"
          id="name"
          required
          placeholder="Example: Ivory Ceramic Table Lamp"
        >

        <label for="category">Category *</label>
        <select id="category" required>
          <option value="">Select category</option>
          <option value="Home Decor">Home Decor</option>
          <option value="Fashion">Fashion</option>
          <option value="Beauty">Beauty</option>
          <option value="Accessories">Accessories</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Lifestyle">Lifestyle</option>
          <option value="Other">Other</option>
        </select>

        <label for="description">Description</label>
        <textarea
          id="description"
          placeholder="Write a short product description"
        ></textarea>

        <label for="price">Price</label>
        <input
          type="text"
          id="price"
          placeholder="Example: $29.99"
        >

        <label for="image">Product Image *</label>
        <input
          type="file"
          id="image"
          accept="image/*"
          required
        >
        <p class="note">
          Choose an image from your device. It will be uploaded to Google Drive.
        </p>

        <label for="link">Amazon Affiliate Link *</label>
        <input
          type="url"
          id="link"
          required
          placeholder="Paste your Amazon affiliate link"
        >

        <label for="tag">Tag</label>
        <input
          type="text"
          id="tag"
          placeholder="Example: Bestseller, New, Trending"
        >

        <button id="uploadBtn" type="submit">
          Upload Product
        </button>

      </form>

      <button id="logoutBtn" type="button">
        Logout
      </button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      setPersistence,
      browserLocalPersistence,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB2iH6w2TJsPQs8TX9ZykJ7zAzfz1Fi-dM",
      authDomain: "cute-finds-admin.firebaseapp.com",
      projectId: "cute-finds-admin",
      storageBucket: "cute-finds-admin.firebasestorage.app",
      messagingSenderId: "161451262975",
      appId: "1:161451262975:web:8870d4fd6e506dabc15dca",
      measurementId: "G-DF6C97NFD0"
    };

    const ALLOWED_EMAIL = "mslvpaul.11@gmail.com";

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycby-xED-OI6BASpaVbZHD0HKFahPt5kBzId7DkpTqBWs6fOcsxFsulHjGMnenkXnbTWV/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginPanel = document.getElementById("loginPanel");
    const adminPanel = document.getElementById("adminPanel");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const productForm = document.getElementById("productForm");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusBox = document.getElementById("status");
    const userInfo = document.getElementById("userInfo");

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "";
    }

    // Google login
    loginBtn.addEventListener("click", async () => {
      clearStatus();
      loginBtn.disabled = true;

      try {
        await setPersistence(auth, browserLocalPersistence);

        const result = await signInWithPopup(auth, provider);
        const email = result.user.email
          ? result.user.email.toLowerCase()
          : "";

        if (email !== ALLOWED_EMAIL) {
          await signOut(auth);
          showStatus(
            "Access denied. This Google account is not authorized.",
            "error"
          );
          return;
        }

        showStatus("Login successful.", "success");

      } catch (error) {
        showStatus("Login error: " + error.message, "error");
      } finally {
        loginBtn.disabled = false;
      }
    });

    // Keep login active after page refresh
    onAuthStateChanged(auth, async (user) => {
      if (user && user.email &&
          user.email.toLowerCase() === ALLOWED_EMAIL) {

        loginPanel.style.display = "none";
        adminPanel.style.display = "block";
        userInfo.textContent = "Welcome, Admin! " + user.email;

      } else {
        loginPanel.style.display = "block";
        adminPanel.style.display = "none";

        if (user) {
          await signOut(auth);
          showStatus("Access denied.", "error");
        }
      }
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        productForm.reset();
        clearStatus();
      } catch (error) {
        showStatus("Logout error: " + error.message, "error");
      }
    });

    // Convert image into Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const result = reader.result;
          const base64 = result.split(",")[1];
          resolve(base64);
        };

        reader.onerror = () => {
          reject(new Error("Could not read the selected image."));
        };

        reader.readAsDataURL(file);
      });
    }

    // Product upload
    productForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearStatus();

      const user = auth.currentUser;

      if (!user || !user.email ||
          user.email.toLowerCase() !== ALLOWED_EMAIL) {
        showStatus("Please sign in with the authorized account first.", "error");
        return;
      }

      const imageFile = document.getElementById("image").files[0];

      if (!imageFile) {
        showStatus("Please select a product image.", "error");
        return;
      }

      if (!imageFile.type.startsWith("image/")) {
        showStatus("Please select a valid image file.", "error");
        return;
      }

      // Keep uploads reasonably small for Apps Script requests
      if (imageFile.size > 2 * 1024 * 1024) {
        showStatus("Please choose an image smaller than 2 MB.", "error");
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = "Sending...";

      try {
        const idToken = await user.getIdToken(true);
        const imageBase64 = await fileToBase64(imageFile);

        const data = {
          authToken: idToken,
          name: document.getElementById("name").value.trim(),
          category: document.getElementById("category").value,
          description: document.getElementById("description").value.trim(),
          price: document.getElementById("price").value.trim(),
          imageBase64: imageBase64,
          imageMimeType: imageFile.type,
          imageName: imageFile.name,
          link: document.getElementById("link").value.trim(),
          tag: document.getElementById("tag").value.trim()
        };

        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(data)
        });

        showStatus(
          "Request sent to the server. Check your Google Sheet for the new product row before uploading another product.",
          "info"
        );

      } catch (error) {
        showStatus("Upload request error: " + error.message, "error");

      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload Product";
      }
    });
  </script>

</body>
</html>
